<main class="signup">

  <!-- IMAGEM -->
  <div class="signup__image">
    <img src="Beliche.png" alt="Ambiente com móveis planejados sob medida">
  </div>

  <!-- FORMULÁRIO -->
  <section class="signup__panel">
    <div class="signup__box">

      <a routerLink="/login" class="back">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
          <path d="M14 8H2M7 3L2 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Voltar ao login
      </a>

      <h1>Criar minha conta</h1>

      <form class="form" (submit)="$event.preventDefault()">

        <div class="form__row">
          <div class="field">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu primeiro nome" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="sobrenome">Sobrenome</label>
            <input type="text" id="sobrenome" name="sobrenome" placeholder="Sobrenome" autocomplete="family-name" required>
          </div>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>

        <div class="form__row">
          <div class="field">
            <label for="senha">Crie uma senha</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" minlength="8" autocomplete="new-password" required>
          </div>
          <div class="field">
            <label for="confirmar">Confirme a senha</label>
            <input type="password" id="confirmar" name="confirmar" placeholder="Repita sua senha" minlength="8" autocomplete="new-password" required>
          </div>
        </div>

        <label class="terms" for="termos">
          <input type="checkbox" id="termos" name="termos" required>
          <span>Li e aceito os Termos de uso e a Política de privacidade</span>
        </label>

        <button type="submit" class="btn">Criar conta</button>
      </form>

      <p class="signup__login">Já tem uma conta? <a routerLink="/login" class="link">Entrar</a></p>

    </div>
  </section>

</main>
