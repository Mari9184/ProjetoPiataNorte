<main class="login">

  <!-- IMAGEM -->
  <div class="login__image">
    <img src="SalaBranca.png" alt="Ambiente com móveis sob medida em madeira">
  </div>

  <!-- FORMULÁRIO -->
  <section class="login__panel">
    <div class="login__box">

      
      <h1>Bem-vindo de volta!</h1>
      <p class="login__sub">Entre com seus dados para acessar sua conta.</p>

      <form class="form" (submit)="$event.preventDefault()">

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>

        <div class="field">
          <div class="field__row">
            <label for="senha">Senha</label>
            <a routerLink="/cadastro" class="link link--small">Esqueci minha senha</a>
          </div>
          <div class="password">
            <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="password__toggle">Mostrar</button>
          </div>
        </div>

        <button type="submit" routerLink="/dashboard" class="btn">Entrar na minha conta</button>
      </form>

      <p class="login__signup">Não tem conta? <a routerLink="/cadastro" class="link">Cadastre-se</a></p>

    </div>
  </section>

</main>
